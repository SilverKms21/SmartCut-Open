name: Build & Release SmartCut

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk binutils

      - name: Build binary with PyInstaller
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip pyinstaller
          .venv/bin/pyinstaller \
            --onefile \
            --windowed \
            --name smartcut-linux \
            --hidden-import tkinter \
            smartcut.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartcut-linux
          path: dist/smartcut-linux
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: smartcut-linux
          path: release-assets

      - name: Ensure Linux binary is executable
        run: chmod +x release-assets/smartcut-linux

      - name: Create Release and attach binary
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/smartcut-linux
