cat << 'EOF' > .github/workflows/build.yml
name: Build & Release SmartCut

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: smartcut-linux
            binary_path: dist/smartcut-linux
          - os: windows-latest
            artifact_name: smartcut-windows
            binary_path: dist/smartcut-windows.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk binutils

      - name: Build binary with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip pyinstaller
          .venv/bin/pyinstaller \
            --onefile \
            --windowed \
            --name smartcut-linux \
            --hidden-import tkinter \
            smartcut.py

      - name: Build binary with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip pyinstaller
          .\.venv\Scripts\python.exe -m PyInstaller `
            --onefile `
            --windowed `
            --name smartcut-windows `
            --hidden-import tkinter `
            smartcut.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Ensure Linux binary is executable
        run: chmod +x release-assets/smartcut-linux

      - name: Create Release and attach binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/smartcut-linux
            release-assets/smartcut-windows.exe
EOF
